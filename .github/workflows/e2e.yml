name: End-to-end tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Race, vet and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install test reporter
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run vet
        run: go vet ./...

      - name: Run race tests with coverage
        run: |
          mkdir -p artifacts
          gotestsum \
            --format testname \
            --junitfile artifacts/unit-race.xml \
            -- -race -coverprofile=artifacts/coverage.out ./...

      - name: Publish unit and race report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: dorny/test-reporter@v2
        with:
          name: Unit and race tests
          path: artifacts/unit-race.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: artifacts/
          if-no-files-found: warn

  build-matrix:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  native-e2e:
    name: Native E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race_flag: "-race"
            run_regex: "."
          - os: macos-latest
            race_flag: ""
            run_regex: "."
          - os: windows-latest
            race_flag: ""
            run_regex: "TestAgentConnectsAndReportsPlatform|TestCLIValidation|TestHTTPControlEndpoints|TestServerAndClientHTTPPresentation|TestHTTPRedirect"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install test reporter
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run native E2E tests
        shell: bash
        run: |
          mkdir -p artifacts
          gotestsum \
            --format testname \
            --junitfile "artifacts/e2e-${{ runner.os }}.xml" \
            -- ${{ matrix.race_flag }} -tags=e2e -count=1 ./e2e \
            -run '${{ matrix.run_regex }}'

      - name: Publish native E2E report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: dorny/test-reporter@v2
        with:
          name: Native E2E (${{ matrix.os }})
          path: artifacts/e2e-${{ runner.os }}.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload native E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-${{ runner.os }}
          path: artifacts/
          if-no-files-found: warn

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e:web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  extended-e2e:
    name: Extended E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install test reporter
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run 1 GiB transfer and interactive terminal tests
        env:
          SLIDER_E2E_INTERACTIVE: "1"
          SLIDER_E2E_LARGE: "1"
        run: |
          mkdir -p artifacts
          gotestsum \
            --format testname \
            --junitfile artifacts/e2e-extended.xml \
            -- -tags=e2e -count=1 ./e2e \
            -run 'TestLargeFileRoundTrip|TestInteractiveShellVim'

      - name: Publish extended E2E report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: dorny/test-reporter@v2
        with:
          name: Extended E2E
          path: artifacts/e2e-extended.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload extended E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-e2e
          path: artifacts/
          if-no-files-found: warn
